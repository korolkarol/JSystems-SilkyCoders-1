spring.application.name=lppsa

# SQLite datasource
spring.datasource.url=jdbc:sqlite:lppsa.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# Flyway
spring.flyway.enabled=true

# OpenRouter via OpenAI-compatible client
spring.ai.openai.base-url=https://openrouter.ai/api
spring.ai.openai.api-key=${OPENROUTER_API_KEY}
spring.ai.openai.chat.options.model=openai/gpt-4o-mini

# Actuator
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=when-authorized

# Structured JSON logging (Loki/Grafana-friendly)
logging.structured.format.console=ecs

# Tracing
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://zipkin:9411/api/v2/spans
